:root{--ink:#243747;--green:#365e53;--muted:#7a877e;--line:#e1e5dc;--paper:#fafaf6;--blue:#7390a5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button:disabled{cursor:default;opacity:.45}button{border:1px solid var(--line);background:white;border-radius:6px;padding:10px 18px;color:var(--green)}button:hover:not(:disabled){border-color:var(--green);background:#f1f5ee}button.primary{background:var(--green);color:white;border-color:var(--green)}button.link{border:0;background:none;padding:4px;color:var(--muted)}button:focus-visible,a:focus-visible{outline:3px solid #97b0bd;outline-offset:3px}header{height:78px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));gap:35px}.brand{font:25px Georgia,"Songti SC",SimSun,serif;white-space:nowrap}.brand b{font-weight:500;letter-spacing:3px}nav{display:flex;gap:28px;flex:1;margin-left:35px}nav button{padding:5px;border:0;background:none;color:#8b948b}nav button.active{color:var(--green);font-weight:600}.avatar{width:32px;height:32px;border-radius:50%;background:#e7ede5;display:inline-grid;place-items:center;color:var(--green);margin-right:8px}main{max-width:1200px;margin:0 auto;padding:38px 24px 90px}h1,h2,h3{font-family:Georgia,"Songti SC",SimSun,serif;line-height:1.45;font-weight:600}h1{font-size:36px;margin:12px 0}h2{font-size:26px;margin:0 0 12px}h3{font-size:22px;margin:15px 0}p{margin:9px 0}.muted,small{color:var(--muted)}small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green)}.row{display:flex;align-items:center;justify-content:space-between;gap:18px}.hero{padding:10px 0 30px}.hero p{max-width:740px;color:var(--muted)}.tabs{display:flex;border-bottom:1px solid var(--line);gap:30px;margin-bottom:30px}.tabs span{padding:1 px;padding:15px 0;border-bottom:1px solid #edf0e8}.mark{border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;background:#eaf2e6;color:var(--green);flex-shrink:0}.warn{background:#fcf1dc;color:#99773b}.project{margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:20px;padding:22px;border:1px solid var(--line);border-radius:6px}.project h3{font-size:21px;margin:0 0 7px}.project p{font-size:13px;color:var(--muted)}.prompt{white-space:pre-wrap;background:#f7f8f3;border:1px solid var(--line);border-radius:6px;padding:20px;font-size:14px}.success{padding:25px;background:#edf4eb;border:1px solid #cfdcc9;border-radius:8px;margin-bottom:24px}.success h2{color:var(--green)}.timeline{margin-top:20px}.timeline .event{padding:0 0 24px 28px;border-left:1px solid #d9e1d4;position:relative}.event:before{content:'';width:9px;height:9px;border:3px solid white;background:#aab8aa;border-radius:50%;position:absolute;left:-8px;top:5px}.event.done:before{background:var(--green)}.event strong{font-size:14px}.event small{display:block}.demo{position:fixed;bottom:0;left:0;width:100%;background:#243747;color:#fff;z-index:20;padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px}.demo button{background:transparent;border-color:#52616c;color:#fff;padding:4px 10px;font-size:11px}.demo select{width:auto;font-size:11px;padding:4px;background:#314654;color:#fff;border-color:#52616c}.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:6px;z-index:50}.empty{padding:45px;text-align:center}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.stat div{padding:15px;border-left:2px solid var(--line)}.stat strong{display:block;font-size:19px}.error{color:#9c583e;font-size:13px}.files{font-size:13px;color:var(--green);margin-top:10px}.technical{font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;background:#f4f6f1;padding:18px;border-radius:5px;overflow:auto}summary{cursor:pointer;color:var(--green);font-size:13px}a{color:var(--green)}@media(max-width:800px){header{padding:0 18px;height:65px}nav{display:none}.grid,.layout{grid-template-columns:1fr}main{padding:24px 18px 120px}.hero h1{font-size:29px}.card{min-height:300px}.row{flex-wrap:wrap}.demo{flex-wrap:wrap;padding:8px 12px}.project{grid-template-columns:1fr}.step{font-size:10px}.stat{gap:5px}.stat strong{font-size:15px}.panel{padding:20px}}
main{max-width:1080px}.hero{padding:40px 0}.hero h1{font-size:42px;max-width:700px}.hero p{font-size:17px;max-width:680px}.collab{color:#365e53;font-size:13px;letter-spacing:2px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:35px 0}.flow article{border-top:2px solid #d8e2d4;padding-top:17px}.flow b{font:32px Georgia;color:#a0b3a1}.flow h3{font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.fileline{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #e1e5dc}.issue{background:#fffaf0;border:1px solid #e8dbc2;padding:20px;border-radius:6px;margin:16px 0}.issue h3{font:600 16px/1.7 sans-serif;margin:0 0 9px}.issue p{font-size:14px}.statusbar{display:flex;gap:20px;background:#fff;padding:23px;border:1px solid #e1e5dc;border-radius:8px;margin:20px 0}.statusbar div{flex:1;padding:12px 15px;border-top:3px solid #e3e8df;color:#97a092}.statusbar .active{border-color:#365e53;color:#365e53}.statuspanel{min-height:270px;padding:35px}.statuspanel h1{font-size:32px}.completeicon{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#e9f2e4;color:#365e53;font-size:24px;margin-bottom:16px}.facts{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:#879184;border-top:1px solid #e1e5dc;padding-top:18px;margin-top:23px}.subtle{font-size:13px;color:#899287}input:focus,textarea:focus{outline:2px solid #92aa92;outline-offset:1px}.demo{font-size:11px}.state-note{max-width:700px}@media(max-width:700px){.formgrid,.flow{grid-template-columns:1fr}.hero h1{font-size:31px}.hero{padding:20px 0}.statusbar{gap:7px;padding:12px}.statusbar div{padding:8px;font-size:13px}.statuspanel{padding:24px}.hero p{font-size:15px}}</style></head><body><header><div class="brand"><b>书生·端砚</b></div><nav><button onclick="go('intro')">合作介绍</button><button onclick="go('status')">任务状态</button></nav><small>库帕思语匠合作专区</small></header><main id="app"></main><div class="demo"><span>V6 本地交互原型 · 不上传文件，不调用真实后端与评审智能体 · 刷新重置</span><div><select aria-label="模拟评审结果" id="scenario"><option value="pass">验证与产物评审合格</option><option value="reject">产物评审不合格</option><option value="revise">需补充材料</option><option value="error">题目评审服务异常</option><option value="runerror">后台运行异常</option><option value="evalerror">产物评审异常</option></select> <button onclick="reset()">重置演示</button></div></div>
<script>const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='intro',task={team:'',org:'',contact:'',email:'',title:'',note:'',files:[],status:'draft',version:1},timer;
function go(p){page=p;render();scrollTo(0,0)}
function reset(){clearTimeout(timer);task={team:'',org:'',contact:'',email:'',title:'',note:'',files:[],status:'draft',version:1};go('intro')}
function intro(){return `<section class="hero"><div class="collab">库帕思语匠 × 书生·端砚</div><h1>让你的科研题目，<br>完成验证与自动运行。</h1><p>提交团队信息、研究标题和题目材料。验证通过后，系统自动在端砚后端运行任务；产物生成后，由你提交产物评审并获取评测报告。</p><div class="actions" style="justify-content:flex-start"><button class="primary" onclick="go(task.status==='draft'?'form':'status')">${task.status==='draft'?'开始提交 →':'查看任务状态 →'}</button></div></section><div class="flow"><article><b>01</b><h3>提交信息与材料</h3><p class="muted">填写团队基本信息、研究标题，上传题目附件。</p></article><article><b>02</b><h3>评审智能体验证</h3><p class="muted">按任务要求验证，有需补充的内容会逐项告知。</p></article><article><b>03</b><h3>自动运行与产物评审</h3><p class="muted">查看后台运行状态与产物，主动提交产物评审，获取评测报告。</p></article></div><div class="panel"><div class="row"><div><h2>提交前，准备好这些材料</h2><p class="muted">团队与联系人信息 · 研究标题 · 题目附件</p></div><span class="badge green">在端砚完成题目验证</span></div><small>附件要求以合作任务说明为准。示例检查项不代表真实评审规则。</small></div>`}
function form(){return `<div class="breadcrumb">合作专区 / 信息收集</div><div class="row"><div><h1>提交研究信息与附件</h1><p class="muted">题目内容通过附件提交，无需重复填写完整题干。</p></div><button class="link" onclick="sample()">填入示例材料</button></div><div class="note">来源：库帕思语匠 · 科研题目验证任务（演示） · 任务编号 YJ-20261110-018</div><form onsubmit="submitTask(event)" class="panel"><h2>团队信息</h2><div class="formgrid">${field('team','团队名称 *','个人参与可填写姓名',true)}${field('org','所属机构','选填',false)}${field('contact','联系人 *','填写联系人姓名',true)}${field('email','联系邮箱 *','用于必要时联系补正',true,'email')}</div><hr><h2>研究信息</h2>${field('title','研究标题 *','填写本次研究或题目的名称',true)}<label for="attachments">题目附件 *</label><div class="upload"><p>选择本次验证所需的题目文件</p><input type="file" id="attachments" multiple aria-label="选择题目附件" onchange="addFiles(this.files)"><p><small>Demo 仅展示文件名和大小，不读取或上传正文。正式格式与大小限制由项目配置。</small></p></div><div id="filelist">${fileList()}</div><label for="note">补充说明</label><textarea id="note" placeholder="可简要说明附件内容或需要关注的事项" oninput="task.note=this.value">${esc(task.note)}</textarea><p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="go('intro')">返回介绍</button><button class="primary" type="submit">提交并开始验证 →</button></div></form>`}
function field(key,label,placeholder,required,type='text'){return `<div><label for="${key}">${label}</label><input id="${key}" type="${type}" ${required?'required':''} value="${esc(task[key])}" placeholder="${placeholder}" oninput="task.${key}=this.value"></div>`}
function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function fileList(){return task.files.map((f,i)=>`<div class="fileline"><span>▧ ${esc(f.name)} <small>· ${size(f.size)}${f.demo?' · 示例':''}</small></span><button type="button" class="link" onclick="removeFile(${i})">移除</button></div>`).join('')}
function addFiles(files){for(const f of files){if(!task.files.some(x=>x.name===f.name&&x.size===f.size))task.files.push({name:f.name,size:f.size})}$('filelist').innerHTML=fileList();$('formError').textContent=''}
function removeFile(i){task.files.splice(i,1);$('filelist').innerHTML=fileList()}
function sample(){Object.assign(task,{team:'科学计算研究小组（示例）',org:'示例研究机构',contact:'示例联系人',email:'researcher@example.com',title:'带约束的二次优化问题',note:'附件包含研究背景、问题定义和结果判断依据。',files:[{name:'研究题目说明.pdf',size:245760,demo:true}]});render()}
function submitTask(e){e.preventDefault();if(task.status==='reviewing')return;if(!task.team.trim()||!task.contact.trim()||!task.email.trim()||!task.title.trim()){$('formError').textContent='请补全团队名称、联系人、联系邮箱与研究标题。';return}if(!task.files.length){$('formError').textContent='请至少添加一份题目附件。';$('attachments').focus();return}task.scenario=$('scenario').value;task.status='reviewing';task.submitted=new Date().toLocaleString('zh-CN');go('status');schedule()}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{task.status=task.scenario==='pass'?'passed':task.scenario==='revise'?'revise':'error';task.finished=new Date().toLocaleString('zh-CN');if(page==='status')render()},2200)}
function edit(){clearTimeout(timer);task.version++;task.status='draft';delete task.finished;delete task.artifacts;delete task.report;delete task.runId;delete task.runStarted;delete task.runFinished;delete task.reportAt;go('form')}
function retry(){task.scenario=$('scenario').value;task.status='reviewing';render();schedule()}
function statusPage(){if(task.status==='draft')return `<div class="panel empty"><h1>尚未提交验证</h1><p class="muted">提交团队信息、研究标题和附件后，即可查看验证状态。</p><button class="primary" onclick="go('form')">继续填写材料</button></div>`;let done=task.status==='passed',revise=task.status==='revise',error=task.status==='error';return `<div class="breadcrumb">合作专区 / 验证状态</div><h1>题目验证进度</h1><p class="muted">${esc(task.title)} · ${esc(task.team)}</p><div class="statusbar" aria-label="任务验证状态"><div class="active">${done?'✓':'01'}　任务验证中</div><div class="${done?'active':''}">${done?'✓':'02'}　任务完成验证</div></div><section class="panel statuspanel" aria-live="polite">${done?'<div class="completeicon">✓</div>':''}<span class="badge ${done?'green':revise||error?'amber':''}">${done?'验证通过':revise?'需补充材料':error?'暂时无法验证':'评审智能体处理中'}</span><h1>${done?'任务完成验证':revise?'请按清单补充材料':error?'验证暂时遇到问题':'任务验证中'}</h1><p class="state-note muted">${done?'你的题目已通过本次任务要求的验证，本次验证流程已完成。':revise?'评审智能体反馈了以下待修改项。修改或替换附件后，可重新提交验证。':error?'本次评审未能完成，这不代表题目不符合要求。请稍后重试。':'材料已提交，评审智能体正在按照本次任务要求进行验证。你可以稍后返回本页面查看结果。'}</p>${done?`<div class="check"><span class="mark">✓</span><div>材料完整性<small style="display:block">已提供题目说明材料（模拟结论）。</small></div></div><div class="check"><span class="mark">✓</span><div>研究目标与判断依据<small style="display:block">满足演示任务规范（模拟结论）。</small></div></div>`:''}${revise?issues():''}<div class="facts"><span>提交编号 YJ-20261110-018-V${task.version}</span><span>提交时间 ${esc(task.submitted)}</span>${done?`<span>完成时间 ${esc(task.finished)}</span>`:''}</div><div class="actions"><button onclick="edit()">返回修改材料</button>${error?'<button class="primary" onclick="retry()">重新验证</button>':''}<button onclick="go('materials')">查看提交材料</button></div></section><p class="subtle">演示说明：以上结论由所选场景模拟生成，未实际解析附件或执行评审。</p>`}
function issues(){let f=esc(task.files[0]?.name||'题目附件');return `<ol style="padding-left:22px"><li class="issue"><h3>${f} → 研究目标</h3><p><b>问题：</b>需要明确本题预期交付物（模拟反馈）。</p><p><b>修改要求：</b>在题目说明中列出需要输出的结果、图表或代码。</p><p><b>通过标准：</b>阅读题目后能明确知道需要交付哪些内容。</p></li><li class="issue"><h3>${f} → 判断依据</h3><p><b>问题：</b>结果判断标准不够明确（模拟反馈）。</p><p><b>修改要求：</b>补充可核验的指标、约束或证明要求。</p><p><b>通过标准：</b>评审方可依据题目给出的条件判断输出是否满足要求。</p></li></ol><small>正式反馈应引用真实文件位置及证据；本清单仅演示反馈方式。重新验证前可将底部场景切换为“验证通过”。</small>`}
function materials(){return `<div class="breadcrumb">验证状态 / 提交材料</div><div class="panel"><h1>${esc(task.title)}</h1><p>团队：${esc(task.team)}<br>机构：${esc(task.org||'未填写')}<br>联系人：${esc(task.contact)}<br>邮箱：${esc(task.email)}</p><hr><h2>已提交附件</h2>${task.files.map(f=>`<p>▧ ${esc(f.name)} <small>${size(f.size)}</small></p>`).join('')}<p class="muted">${esc(task.note)}</p><div class="actions"><button onclick="edit()">返回修改材料</button><button onclick="go('status')">返回验证状态</button></div></div>`}
function render(){$('app').innerHTML=({intro,form,status:statusPage,materials}[page]||intro)()}
const executionStates=['running','run_error','completed','evaluating','evaluation_error','evaluated'];
function schedule(){clearTimeout(timer);const version=task.version;timer=setTimeout(()=>{if(version!==task.version||task.status!=='reviewing')return;if(task.scenario==='revise'||task.scenario==='error'){task.status=task.scenario==='revise'?'revise':'error';task.finished=new Date().toLocaleString('zh-CN');if(page==='status')render();return}task.validatedAt=new Date().toLocaleString('zh-CN');startRun()},1800)}
function startRun(){clearTimeout(timer);task.status='running';task.runId=`RUN-V${task.version}-001`;task.runStarted=new Date().toLocaleString('zh-CN');delete task.artifacts;delete task.report;delete task.reportAt;if(page==='status')render();const version=task.version;timer=setTimeout(()=>{if(version!==task.version||task.status!=='running')return;if(task.scenario==='runerror'){task.status='run_error'}else{task.status='completed';task.runFinished=new Date().toLocaleString('zh-CN');task.artifacts=[{name:'运行摘要.md',type:'运行说明',content:`# 模拟运行摘要\n\n研究标题：${task.title}\n运行编号：${task.runId}\n材料版本：V${task.version}\n\n本文件为交互原型生成的演示产物。已模拟完成材料加载、任务执行和结果归档；未进行真实科研计算，不包含有效科学结论。\n`},{name:'结果记录.json',type:'结构化记录',content:JSON.stringify({demo:true,title:task.title,run_id:task.runId,version:task.version,status:'simulated_completed',scientific_result:null,note:'未调用真实模型，不代表科研问题已解决'},null,2)},{name:'过程记录.txt',type:'过程记录',content:`【模拟记录】\n题目验证通过\n后台任务已创建：${task.runId}\n模拟执行完成\n产物已生成，等待专家提交产物评审\n`}]};if(page==='status')render()},3500)}
function submitEvaluation(){if(!['completed','evaluation_error'].includes(task.status)||!task.artifacts?.length)return;clearTimeout(timer);task.status='evaluating';task.evaluationSubmitted=new Date().toLocaleString('zh-CN');render();const version=task.version;timer=setTimeout(()=>{if(version!==task.version||task.status!=='evaluating')return;if(task.scenario==='evalerror'){task.status='evaluation_error'}else{task.status='evaluated';task.reportAt=new Date().toLocaleString('zh-CN');task.report=`# 产物评测报告（模拟）\n\n研究标题：${task.title}\n运行编号：${task.runId}\n材料版本：V${task.version}\n生成时间：${task.reportAt}\n\n## 评测对象\n${task.artifacts.map(a=>'- '+a.name).join('\n')}\n\n## 评测结论\n模拟产物的文件结构与运行关联记录完整。科学正确性未验证，不能据此认定真实课程任务通过。\n\n## 检查明细\n- 产物完整性：已包含运行摘要、结构化结果和过程记录。\n- 版本一致性：产物关联本次题目版本与运行编号。\n- 科学正确性：未开展真实计算与科学评测。\n\n## 建议\n正式接入后由产物评审智能体按任务规范生成结论、逐项证据与修改建议。\n`};if(page==='status')render()},2200)}
function downloadArtifact(i){const a=task.artifacts?.[i];if(a)downloadText(a.name,a.content)}
function downloadText(name,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function executionPage(){const s=task.status,ready=['completed','evaluating','evaluation_error','evaluated'].includes(s),reported=s==='evaluated';let title=s==='running'?'任务运行中':s==='run_error'?'任务运行暂时异常':s==='evaluating'?'产物评审中':s==='evaluation_error'?'产物评审暂时异常':reported?'产物评测报告已生成':'任务已完成';let desc=s==='running'?'题目已通过验证，系统已自动将任务送入端砚后端执行。你无需另行打开端砚或手动启动。':s==='run_error'?'后台任务暂未完成，当前没有可提交评审的完整产物。请稍后重试或联系任务支持。':s==='evaluating'?'已收到你的评审提交，产物评审智能体正在生成本次产物的评测报告。':s==='evaluation_error'?'本次产物评审暂未完成，运行产物已保留，可以重新提交评审。':reported?'本次产物评审流程已结束，可查看或下载评测报告。':'端砚后端任务已运行完成，产物已就绪。请查看产物，并点击“提交产物评审”进入下一步。';return `<div class="breadcrumb">合作专区 / 任务进度</div><h1>验证、运行与产物评审</h1><p class="muted">${esc(task.title)} · ${esc(task.team)}</p><div class="statusbar" style="flex-wrap:wrap" aria-label="任务进度"><div class="active">✓ 题目验证通过</div><div class="active">${ready?'✓':'02'} 任务运行</div><div class="${ready?'active':''}">${ready?'✓':'03'} 任务已完成</div><div class="${['evaluating','evaluation_error','evaluated'].includes(s)?'active':''}">${reported?'✓':'04'} 专家提交产物评审</div><div class="${reported?'active':''}">${reported?'✓':'05'} 生成评测报告</div></div><section class="panel statuspanel" aria-live="polite"><span class="badge ${s.endsWith('error')?'amber':'green'}">${title}</span><h1>${title}</h1><p class="muted state-note">${desc}</p><div class="facts"><span>题目版本 V${task.version}</span><span>运行编号 ${esc(task.runId)}</span><span>验证通过 ${esc(task.validatedAt)}</span>${ready?`<span>运行完成 ${esc(task.runFinished)}</span>`:''}</div>${ready?`<hr><h2>本次任务产物 <small>模拟文件，可下载</small></h2>${task.artifacts.map((a,i)=>`<div class="fileline"><div><strong>${esc(a.name)}</strong><small style="display:block">${a.type} · ${esc(task.runId)}</small></div><button onclick="downloadArtifact(${i})">下载</button></div><details style="margin:10px 0"><summary>预览 ${esc(a.name)}</summary><pre class="prompt" style="overflow-wrap:anywhere">${esc(a.content)}</pre></details>`).join('')}`:''}${s==='completed'?'<div class="note">任务运行完成不等于产物评审通过。请主动提交产物评审，由评审智能体生成评测报告。</div>':''}${reported?`<hr><h2>产物评测报告</h2><p class="muted">已关联本次运行与材料版本 · ${esc(task.reportAt)}</p><div class="note">演示结论：文件结构与关联记录完整；科学正确性未验证。报告已生成不等于真实任务达标。</div><details open><summary>查看完整评测报告</summary><pre class="prompt" style="overflow-wrap:anywhere">${esc(task.report)}</pre></details><button onclick="downloadText('产物评测报告-模拟.md',task.report)">下载评测报告</button>`:''}<div class="actions"><button onclick="edit()">返回修改材料</button><button onclick="go('materials')">查看提交材料</button>${s==='completed'?'<button class="primary" onclick="submitEvaluation()">提交产物评审 →</button>':s==='evaluating'?'<button class="primary" disabled>正在生成评测报告…</button>':s==='evaluation_error'?'<button class="primary" onclick="task.scenario=\'pass\';submitEvaluation()">重新提交产物评审</button>':s==='run_error'?'<button class="primary" onclick="task.scenario=\'pass\';startRun()">重新运行任务</button>':''}</div><small>返回修改会创建新材料版本，重新验证与运行；当前演示结果不会沿用到新版。</small></section><p class="subtle">此为本地交互模拟，不执行真实后端任务或评审；文件与报告均标明模拟内容。</p>`}
const originalStatusPage=statusPage;
statusPage=function(){return executionStates.includes(task.status)?executionPage():originalStatusPage()};

let roundHistory=[];
const revisionIssues=[{where:'赛题附件 → 预期产物要求',problem:'产物未包含约束验证结果，原赛题未明确要求交付该项材料。',fix:'在赛题附件中明确要求提供约束验证代码、运行结果和可行性结论。'},{where:'赛题附件 → 结果判断标准',problem:'现有判断条件不足以核验数值结果精度。',fix:'在赛题中补充数值误差要求与验证方法，然后替换附件重新提交。'}];
function restartTask(){if(task.status!=='evaluated'||task.verdict!=='rejected')return;roundHistory.push({version:task.version,title:task.title,runId:task.runId,report:task.report,artifacts:JSON.parse(JSON.stringify(task.artifacts)),verdict:task.verdict,reportAt:task.reportAt});editBase();task.needsRevision=true;task.revisionNote='';delete task.verdict;delete task.validatedAt;delete task.evaluationSubmitted;delete task.submitted;task.scenario='pass';$('scenario').value='pass';render()}
function revisionList(){return `<ol style="padding-left:22px">${revisionIssues.map(x=>`<li class="issue"><h3>${esc(x.where)}</h3><p><b>不合格原因：</b>${esc(x.problem)}</p><p><b>赛题修改要求：</b>${esc(x.fix)}</p></li>`).join('')}</ol>`}
const editBase=edit;
edit=function(){if(task.status==='evaluated'&&task.verdict==='rejected'){restartTask();return}editBase();delete task.verdict;delete task.validatedAt;delete task.evaluationSubmitted;delete task.submitted};
const submitBase=submitTask;
submitTask=function(e){if(task.needsRevision&&!task.revisionNote?.trim()){e.preventDefault();$('formError').textContent='请填写本轮修改说明，说明如何根据上一轮报告修改赛题。';$('revisionNote').focus();return}submitBase(e)};
function submitEvaluation(){if(!['completed','evaluation_error'].includes(task.status)||!task.artifacts?.length)return;clearTimeout(timer);task.status='evaluating';task.evaluationSubmitted=new Date().toLocaleString('zh-CN');render();const version=task.version;timer=setTimeout(()=>{if(version!==task.version||task.status!=='evaluating')return;if(task.scenario==='evalerror'){task.status='evaluation_error'}else{task.status='evaluated';task.reportAt=new Date().toLocaleString('zh-CN');task.verdict=task.scenario==='reject'?'rejected':'passed';const bad=task.verdict==='rejected';task.report=`# 产物评测报告（模拟）\n\n研究标题：${task.title}\n运行编号：${task.runId}\n材料版本：V${task.version}\n评测时间：${task.reportAt}\n\n## 评测结论\n${bad?'不合格：需要修改赛题并重新运行。':'合格（演示结论）：本轮模拟产物满足演示评测要求。'}\n\n## 评测对象\n${task.artifacts.map(a=>'- '+a.name).join('\n')}\n\n${bad?'## 不合格原因与修改要求\n'+revisionIssues.map((x,i)=>`${i+1}. ${x.where}\n原因：${x.problem}\n修改要求：${x.fix}\n评审依据：${x.evidence}\n通过标准：${x.criteria}`).join('\n\n'):'## 检查项\n- 产物完整性：模拟通过。\n- 约束验证记录：模拟通过。\n- 结果判断依据：模拟通过。'}\n\n${task.revisionNote?'## 本轮修改说明\n'+task.revisionNote+'\n\n':''}## 使用范围\n本报告仅为交互演示，未开展真实计算、附件解析或科学评测，不代表真实题目或产物质量。\n`};if(page==='status')render()},2200)}
const executionBase=executionPage;
executionPage=function(){let html=executionBase();if(task.status!=='evaluated')return html;const bad=task.verdict==='rejected';html=html.replaceAll('产物评测报告已生成',bad?'产物评审不合格 · 需重新开始任务':'产物评审合格 · 报告已生成');html=html.replace('本次产物评审流程已结束，可查看或下载评测报告。',bad?'请按下方问题清单修改赛题，重新验证并运行，再提交新一轮产物评审。':'本轮产物评审已合格，可查看或下载评测报告。（模拟结论）');html=html.replace('演示结论：文件结构与关联记录完整；科学正确性未验证。报告已生成不等于真实任务达标。',bad?'本轮评测不合格。修改赛题后需重新验证、运行和提交评审；本轮报告与产物将保留为历史记录。':'本轮模拟评测合格，真实结论以正式评审智能体的结果为准。');if(bad){html=html.replace('<span class="badge green">产物评审不合格','<span class="badge amber">产物评审不合格');html=html.replace('<hr><h2>产物评测报告</h2>','<hr><h2>需要修改的赛题内容</h2>'+revisionList()+'<div class="actions"><button class="primary" onclick="restartTask()">重新开始任务 → 修改赛题</button></div><hr><h2>产物评测报告</h2>');html=html.replace('<button onclick="edit()">返回修改材料</button>','')}return html};
const formBase=form;
form=function(){let html=formBase();if(!task.needsRevision)return html;html=html.replace('<h2>团队信息</h2>',`<div class="note"><strong>第 ${task.version} 轮：根据评测报告修改赛题</strong><p>原团队信息、研究标题与附件列表已保留。请替换或补充赛题附件；上一轮产物与报告仅作为历史记录。</p></div>${revisionList()}<label for="revisionNote">本轮修改说明 *</label><textarea id="revisionNote" required oninput="task.revisionNote=this.value" placeholder="说明修改了哪些赛题条件、产物要求或判断标准">${esc(task.revisionNote)}</textarea><hr><h2>团队信息</h2>`);html=html.replace('提交并开始验证 →','提交修改后的赛题，重新验证 →');return html};
function historyView(){return `<section class="panel" style="margin-top:24px"><h2>历史评测记录</h2><p class="muted">历史结果仅供查看，不参与新一轮评审。</p>${roundHistory.map((r,i)=>`<details style="margin:16px 0"><summary>第 ${r.version} 轮 · 不合格 · ${esc(r.runId)}</summary><pre class="prompt">${esc(r.report)}</pre><button onclick="downloadText('第${r.version}轮-评测报告.md',roundHistory[${i}].report)">下载本轮报告</button>${r.artifacts.map((a,j)=>`<button onclick="downloadText(roundHistory[${i}].artifacts[${j}].name,roundHistory[${i}].artifacts[${j}].content)">${esc(a.name)}</button>`).join('')}</details>`).join('')}</section>`}
const renderBase=render;
render=function(){renderBase();if(roundHistory.length&&['form','status','materials'].includes(page))$('app').innerHTML+=historyView()};
const resetBase=reset;
reset=function(){roundHistory=[];resetBase()};

// Build a standard ZIP with UTF-8 names and stored entries; no external dependency.
function zipBytes(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;function header(n){let b=new Uint8Array(n);return [b,new DataView(b.buffer)]}function crc(data){let n=0xffffffff;for(const byte of data){n^=byte;for(let k=0;k<8;k++)n=(n>>>1)^((n&1)?0xedb88320:0)}return (n^0xffffffff)>>>0}for(const e of entries){let name=enc.encode(e.name),data=enc.encode(e.content),sum=crc(data);let [h,v]=header(30);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,sum,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);parts.push(h,name,data);let [c,w]=header(46);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint16(14,33,true);w.setUint32(16,sum,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,name.length,true);w.setUint32(42,offset,true);central.push(c,name);offset+=h.length+name.length+data.length}let centralSize=central.reduce((s,a)=>s+a.length,0),[end,d]=header(22);d.setUint32(0,0x06054b50,true);d.setUint16(8,entries.length,true);d.setUint16(10,entries.length,true);d.setUint32(12,centralSize,true);d.setUint32(16,offset,true);let all=[...parts,...central,end],out=new Uint8Array(offset+centralSize+22),pos=0;for(const a of all){out.set(a,pos);pos+=a.length}return out}
function downloadPackage(historyIndex){const record=Number.isInteger(historyIndex)?roundHistory[historyIndex]:task;if(!record?.artifacts?.length)return;const entries=record.artifacts.map(a=>({name:'产物/'+a.name,content:a.content}));if(record.report)entries.push({name:'产物评审报告.md',content:record.report});const blob=new Blob([zipBytes(entries)],{type:'application/zip'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`任务产物-${record.runId}-模拟.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function packagePanel(){return `<hr><h2>任务产物压缩包</h2><div class="fileline"><div><strong>任务产物-${esc(task.runId)}-模拟.zip</strong><small style="display:block">本轮运行产物${task.report?'及产物评审报告':''} · 题目版本 V${task.version}</small></div><button onclick="downloadPackage()">下载压缩包</button></div><p class="subtle">一次下载本轮产物。报告生成后会一并放入压缩包；所有内容为模拟数据。</p>`}
revisionIssues[0].evidence='模拟检查：运行摘要中没有可行性验证结论，产物清单未体现验证代码与结果。';
revisionIssues[0].criteria='新版赛题明确要求验证代码、运行结果及约束结论；新一轮产物包含这些内容。';
revisionIssues[1].evidence='模拟检查：结果记录缺少精度阈值与误差校验信息。';
revisionIssues[1].criteria='新版赛题写明误差阈值与验证方法；新一轮结果提供相应检查记录。';
revisionList=function(){return `<ol style="padding-left:22px">${revisionIssues.map(x=>`<li class="issue"><h3>${esc(x.where)}</h3><p><b>问题说明：</b>${esc(x.problem)}</p><p><b>评审依据：</b>${esc(x.evidence)}</p><p><b>需要修改：</b>${esc(x.fix)}</p><p><b>通过标准：</b>${esc(x.criteria)}</p></li>`).join('')}</ol>`};
const packageExecutionBase=executionPage;
executionPage=function(){let html=packageExecutionBase();const start=html.indexOf('<hr><h2>本次任务产物');if(start>=0){let end=html.indexOf('</details>',start);for(let i=1;i<task.artifacts.length;i++)end=html.indexOf('</details>',end+10);if(end>=0)html=html.slice(0,start)+packagePanel()+html.slice(end+10)}return html};
historyView=function(){return `<section class="panel" style="margin-top:24px"><h2>历史评测记录</h2><p class="muted">历史报告与对应产物保留在各轮压缩包中，不沿用到新一轮。</p>${roundHistory.map((r,i)=>`<details style="margin:16px 0"><summary>第 ${r.version} 轮 · 不合格 · ${esc(r.runId)}</summary><pre class="prompt">${esc(r.report)}</pre><button onclick="downloadPackage(${i})">下载本轮产物及报告压缩包</button></details>`).join('')}</section>`};

render();
